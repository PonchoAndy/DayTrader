# One-off exploration for #30: fetch community bonus-ID data and print rows for our bonus IDs.
name: Explore bonus data
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Comma-separated bonus IDs"
        default: "12718,12719,12720,12721,12722,12723,12724,12725,12726,12727,12728,12729,12730,12731,12732,12733,12734,12735,12736,12740,12741,12742,12743,12744,12745,12746,12747,12748,12749,12750,12751,12752,12753,12754,12755,12756,12759,12917,12919,12920"
permissions:
  contents: read
jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python collector/bonus_explore.py "${{ inputs.ids }}"
