# Hourly WoW Forever auction collector (PonchoAndy/DayTrader#9, ADR 0005).
# Blizzard refreshes the data at :17 past each hour; a run must start between :18 and :16 of the next
# hour to catch each refresh. GitHub starts scheduled runs 29-63 min late (measured 2026-11-14, #28), so
# the slot is :05: it lands runs at ~:34-:08, inside that window. The collector skips runs with no new data.
name: Collect auctions

on:
  schedule:
    - cron: "5 * * * *"
    # Daily listing flows (#37): every complete UTC day still in raw/ that has no flows file yet.
    - cron: "35 1 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Collect even if Blizzard hasn't published new data"
        type: boolean
        default: false
      report:
        description: "Don't collect; print an overview of the stored data (collector/report.py)"
        type: boolean
        default: false
      regions:
        description: "Regions to collect, comma-separated, US first (e.g. us,eu). Empty = the scheduled default"
        type: string
        default: ""
      flows:
        description: "Don't collect; build listing flows for every complete day not done yet (collector/flows.py, #37)"
        type: boolean
        default: false
      flows_rebuild:
        description: "Don't collect; rebuild listing flows for every day still in raw/, overwriting them (new rules, #69/#81)"
        type: boolean
        default: false
      demo:
        description: "Don't collect; commit the overnight series for the demo page (tools/overnight-demo/) to this branch"
        type: boolean
        default: false
      health:
        description: "Don't collect; commit the last 48 hours' health summary (tools/health/health.json) to this branch"
        type: boolean
        default: false
      market:
        description: "Don't collect; commit price history for crafting materials (tools/market/market.json) to this branch"
        type: boolean
        default: false

concurrency:
  # A flows rebuild can take an hour; its own group keeps it from holding up (and cancelling) hourly runs.
  group: ${{ inputs.flows_rebuild && 'flows-rebuild' || 'collect' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    if: ${{ !inputs.demo && !inputs.flows && !inputs.flows_rebuild && !inputs.health && !inputs.market && github.event.schedule != '35 1 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Start the job clock (job_seconds in run logs, #54)
        run: echo "JOB_STARTED=$(date +%s.%N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        id: py
        with:
          python-version: "3.12"
      # Keep the installed packages between runs (~3 s to restore instead of ~10 s to install),
      # so a run covering US + Europe stays under GitHub's one-minute billing unit (#54).
      - uses: actions/cache@v4
        id: venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt') }}
      - name: Install packages (only when the list changed)
        if: steps.venv.outputs.cache-hit != 'true'
        run: python -m venv .venv && .venv/bin/pip install -q -r requirements.txt
      - name: Collect
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          # US + Europe in one run (ADR 0009); the US is always stored first. Timing test (#54,
          # 2026-11-15): ~22 s per run with cached packages, ~41 s when the cache is rebuilt.
          REGIONS: ${{ inputs.regions || 'us,eu' }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: daytrader-data
        run: .venv/bin/python collector/${{ inputs.report && 'report.py' || 'collect.py' }} ${{ (!inputs.report && inputs.force) && '--force' || '' }}

  # Daily (01:35 UTC) or manual: listing flows from raw pulls (#37, ADR 0008). Catches up on any missed days.
  flows:
    if: ${{ inputs.flows || inputs.flows_rebuild || github.event.schedule == '35 1 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150   # a nightly run takes ~5-12 min; a full rebuild (flows_rebuild) ~5-7 min per day still in raw/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        id: py
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        id: venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt') }}
      - name: Install packages (only when the list changed)
        if: steps.venv.outputs.cache-hit != 'true'
        run: python -m venv .venv && .venv/bin/pip install -q -r requirements.txt
      - name: Build flows
        env:
          REGIONS: us,eu
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: daytrader-data
        run: .venv/bin/python collector/flows.py ${{ inputs.flows_rebuild && '--rebuild' || '' }}

  # Manual only: writes the demo page's data file and commits it to the branch the run was started from.
  demo:
    if: ${{ inputs.demo }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Export demo data
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: daytrader-data
        run: python collector/report.py --demo tools/overnight-demo/demo-data.json
      - name: Commit it to this branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/overnight-demo/demo-data.json
          if git diff --cached --quiet; then echo "Nothing new to commit"; else git commit -m "Demo data export" && { for i in 1 2 3; do git push && break; [ "$i" = 3 ] && exit 1; echo "Push refused, retrying in 10 s ($i/3)"; sleep 10; done; }; fi

  # Manual only: the last 48 hours of run health per region (#18, #54) for Claude sessions, which
  # can't read R2 or download logs. Read-only on R2; the only job besides demo that writes to the repo.
  health:
    if: ${{ inputs.health }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        id: py
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        id: venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt') }}
      - name: Install packages (only when the list changed)
        if: steps.venv.outputs.cache-hit != 'true'
        run: python -m venv .venv && .venv/bin/pip install -q -r requirements.txt
      - name: Export health summary
        env:
          REGIONS: us,eu
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: daytrader-data
        run: .venv/bin/python collector/report.py --health-json tools/health/health.json
      - name: Commit it to this branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/health/health.json
          if git diff --cached --quiet; then echo "Nothing new to commit"; else git commit -m "Health summary export" && { for i in 1 2 3; do git push && break; [ "$i" = 3 ] && exit 1; echo "Push refused, retrying in 10 s ($i/3)"; sleep 10; done; }; fi

  # Manual only: price history, listing flows and vendor prices of crafting materials (Trade Goods,
  # reagents) for US and EU, for Claude sessions, which can't read R2. Read-only on R2; Blizzard is
  # called only for vendor prices of items not in the previous export (collector/market.py).
  market:
    if: ${{ inputs.market }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        id: py
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        id: venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt') }}
      - name: Install packages (only when the list changed)
        if: steps.venv.outputs.cache-hit != 'true'
        run: python -m venv .venv && .venv/bin/pip install -q -r requirements.txt
      - name: Export crafting-material prices
        env:
          REGIONS: us,eu
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: daytrader-data
        run: .venv/bin/python collector/market.py --out tools/market/market.json
      - name: Commit it to this branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/market/market.json
          if git diff --cached --quiet; then echo "Nothing new to commit"; else git commit -m "Market export: crafting-material prices" && { for i in 1 2 3; do git push && break; [ "$i" = 3 ] && exit 1; echo "Push refused, retrying in 10 s ($i/3)"; sleep 10; done; }; fi
