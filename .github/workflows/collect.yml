# Hourly WoW Forever auction collector (PonchoAndy/DayTrader#9, ADR 0005).
# Blizzard refreshes the data at about :17 past each hour, so this runs at :27.
# GitHub may start scheduled runs a few minutes late; the collector skips runs with no new data.
name: Collect auctions

on:
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Collect even if Blizzard hasn't published new data"
        type: boolean
        default: false
      dump_bonuses:
        description: "Instead of collecting, print the version-name table (temporary, for the data tour)"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Print version names
        if: ${{ inputs.dump_bonuses }}
        working-directory: collector
        run: python -c "import bonuses, json; t = bonuses.fetch(); print('BONUSJSON' + t[['bonus_id','suffix','stats']].to_json(orient='values'))"
      - name: Collect
        if: ${{ !inputs.dump_bonuses }}
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          BLIZZARD_REGION: us
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: daytrader-data
        run: python collector/collect.py ${{ inputs.force && '--force' || '' }}
