# Hourly WoW Forever auction collector (PonchoAndy/DayTrader#9, ADR 0005).
# Blizzard refreshes the data at about :17 past each hour, so this runs at :27.
# GitHub may start scheduled runs a few minutes late; the collector skips runs with no new data.
name: Collect auctions

on:
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Collect even if Blizzard hasn't published new data"
        type: boolean
        default: false
      explore_bonus:
        description: "Instead of collecting, print community bonus-ID data for our variants (#30)"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Explore bonus data (#30)
        if: ${{ inputs.explore_bonus }}
        run: python collector/bonus_explore.py 12718,12719,12720,12721,12722,12723,12724,12725,12726,12727,12728,12729,12730,12731,12732,12733,12734,12735,12736,12740,12741,12742,12743,12744,12745,12746,12747,12748,12749,12750,12751,12752,12753,12754,12755,12756,12759,12917,12919,12920
      - name: Collect
        if: ${{ !inputs.explore_bonus }}
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          BLIZZARD_REGION: us
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: daytrader-data
        run: python collector/collect.py ${{ inputs.force && '--force' || '' }}
